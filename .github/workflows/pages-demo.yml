name: Deploy static demo to GitHub Pages

# Builds a read-only static demo (see demo/build-demo.mjs) against a throwaway,
# seeded Postgres and publishes it. The real app code on other branches is untouched.
on:
  push:
    branches: [pages-demo]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: erp
          POSTGRES_PASSWORD: erp
          POSTGRES_DB: erp_facturation
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U erp -d erp_facturation"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://erp:erp@127.0.0.1:5432/erp_facturation?schema=public
      BASE_PATH: /${{ github.event.repository.name }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      # --legacy-peer-deps: nodemailer@10 (devDependency) conflicts with next-auth's optional peer range.
      - run: npm ci --legacy-peer-deps
      - run: npx prisma generate
      - run: npx prisma migrate deploy
      - run: npx tsx prisma/seed.ts
      - run: npx tsx prisma/seed-demo.ts
      - run: node demo/build-demo.mjs
      - run: node demo/check-links.mjs
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
