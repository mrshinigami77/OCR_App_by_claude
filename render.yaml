# Render Blueprint: full app (Next.js frontend + server actions + Prisma) and its PostgreSQL database.
# Next.js is a single service: it serves both the UI and the backend logic.
databases:
  - name: erp-db
    databaseName: erp_facturation
    user: erp
    plan: free # Render's free Postgres expires after 30 days; use a paid plan to keep data

services:
  - type: web
    name: erp-facturation
    runtime: node
    plan: free # free web services sleep after inactivity (slow first request)
    buildCommand: >-
      npm ci --legacy-peer-deps &&
      npx prisma generate &&
      npx prisma migrate deploy &&
      npx tsx prisma/seed.ts &&
      npm run build
    startCommand: npm start
    healthCheckPath: /login
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: DATABASE_URL
        fromDatabase:
          name: erp-db
          property: connectionString
      - key: AUTH_SECRET
        generateValue: true
      - key: AUTH_TRUST_HOST # Auth.js behind Render's proxy
        value: "true"
      - key: SEED_ADMIN_EMAIL # enter in the Render dashboard; creates the first admin login
        sync: false
      - key: SEED_ADMIN_PASSWORD
        sync: false
